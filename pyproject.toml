[project]
name = "youtube-transcript-downloader"
version = "0.3.0"
description = "Download the transcripts of YouTube videos and playlists as text, JSON, SRT or WebVTT files"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Nicolas Huber", email = "nicolas.huber.dev@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "youtube-transcript-api>=1.2.5",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
yt-transcript = "youtube_transcript_downloader.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["data", "transcripts"]

[tool.ruff.lint]
# pycodestyle errors, Pyflakes, import sorting, pyupgrade, bugbear
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
